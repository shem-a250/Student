<!-- students.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students • Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Global Loading Animation -->
  <div id="globalLoader" class="loader-overlay">
    <div class="futuristic-spinner"></div>
  </div>


  <!-- Top Navigation -->
  <header class="top-nav glass">

    <div class="nav-brand">

      <svg class="logo-icon" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>

      <span class="system-title">
        G S Kadendegeri • Students
      </span>

    </div>


    <div class="nav-meta">

      <a href="dashboard.html"
      class="glow-btn secondary"
      style="text-decoration:none;">
        📊 Dashboard
      </a>

    </div>

  </header>



  <!-- Main Container -->
  <main class="students-container">


    <!-- Search & Filter Section -->
    <section class="search-section glass-card">

      <input 
      type="text"
      id="searchId"
      placeholder="🔍 Student ID">


      <input 
      type="text"
      id="searchFirstName"
      placeholder="First Name">


      <input 
      type="text"
      id="searchLastName"
      placeholder="Last Name">


      <select id="filterDept">

        <option value="">
          All Departments
        </option>

      </select>



      <select id="filterGender">

        <option value="">
          All Genders
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

      </select>


    </section>




    <!-- Add Student Button -->
    <section class="glass-card"
    style="
    margin-bottom:1.5rem;
    display:flex;
    justify-content:flex-end;
    ">

      <button 
      class="glow-btn"
      id="openAddModal">

        ➕ Add Student

      </button>

    </section>




    <!-- Students Table -->
    <section class="table-wrapper glass">

      <table id="studentTable">

        <thead>

          <tr>

            <th>
              Photo
            </th>

            <th>
              Student ID
            </th>

            <th>
              First Name
            </th>

            <th>
              Last Name
            </th>

            <th>
              Gender
            </th>

            <th>
              DOB
            </th>

            <th>
              Department
            </th>

            <th>
              Year
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>


        <tbody>

        </tbody>


      </table>

    </section>



    <!-- Pagination -->
    <div 
    class="pagination"
    id="pagination">

    </div>


  </main>





  <!-- ADD / EDIT STUDENT MODAL -->

  <div 
  class="modal-overlay"
  id="studentModal">


    <div class="modal">


      <h2 id="modalTitle">
        Add Student
      </h2>



      <form id="studentForm">


        <input 
        type="hidden"
        id="editIndex">



        <div class="form-group">

          <label>
            Student ID
          </label>

          <input 
          type="text"
          id="studentId"
          required>

        </div>




        <div class="form-group">

          <label>
            First Name
          </label>

          <input
          type="text"
          id="firstName"
          required>

        </div>





        <div class="form-group">

          <label>
            Last Name
          </label>

          <input
          type="text"
          id="lastName"
          required>

        </div>





        <div class="form-group">

          <label>
            Gender
          </label>


          <select id="gender">

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>


          </select>


        </div>





        <div class="form-group">

          <label>
            Date of Birth
          </label>


          <input
          type="date"
          id="dob"
          required>


        </div>






        <div class="form-group">

          <label>
            Department
          </label>


          <input
          type="text"
          id="department"
          placeholder="e.g Computer Science"
          required>


        </div>







        <div class="form-group">

          <label>
            Academic Year
          </label>


          <input
          type="text"
          id="academicYear"
          placeholder="2025-2026"
          required>


        </div>








        <div class="form-group">

          <label>
            Student Photo
          </label>


          <input
          type="file"
          id="photo"
          accept="image/*">


        </div>








        <div class="form-actions">


          <button
          type="button"
          class="glow-btn secondary"
          onclick="closeModal()">

            Cancel

          </button>





          <button
          type="submit"
          class="glow-btn">

            Save

          </button>



        </div>


      </form>



    </div>


  </div>








  <!-- DELETE CONFIRMATION MODAL -->

  <div
  class="modal-overlay"
  id="deleteModal">


    <div 
    class="modal"
    style="text-align:center;">


      <div style="font-size:3rem;">
        ⚠️
      </div>


      <h2>
        Confirm Delete
      </h2>



      <p>
        Are you sure you want to delete this student?
      </p>



      <div 
      class="form-actions"
      style="justify-content:center;">



        <button
        class="glow-btn secondary"
        onclick="closeDeleteModal()">

          Cancel

        </button>





        <button
        class="glow-btn"
        style="background:#ef4444;"
        id="confirmDeleteBtn">

          Delete

        </button>



      </div>



    </div>


  </div>









  <!-- PROFILE VIEW MODAL -->

  <div
  class="modal-overlay"
  id="profileModal">


    <div
    class="modal"
    style="text-align:center;">



      <div
      id="profileContent">

      </div>





      <button
      class="glow-btn secondary"
      onclick="closeProfileModal()">

        Close

      </button>



    </div>


  </div>







  <!-- Scripts -->

  <script src="js/api.js"></script>

  <script src="js/utils.js"></script>

  <script src="js/students.js"></script>



</body>
</html>
